[package]
name = "windows-resizer"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "macOS-style symmetric window resizing (Alt+drag) and center-window hotkey for Windows"
license = "MIT"
repository = "https://github.com/chichionesin/Mirror-Drag"
keywords = ["windows", "window-management", "resize", "hotkey"]
categories = ["os::windows-apis", "command-line-utilities"]
publish = false

[[bin]]
name = "windows-resizer"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
